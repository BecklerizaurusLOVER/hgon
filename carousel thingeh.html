<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {position: relative}
    .safari-slide {height: 200px; text-align: center; padding-top: 75px; font-size: 1.8rem; color: white}
    .slide-forest {background: rgb(10, 57, 10)}
    .slide-ocean {background: rgb(0, 255, 221)}
    .slide-desert {background: rgb(255, 243, 185)}
    .section {padding: 70px 20px; min-height: 300px}
    #forest {background: rgb(241, 255, 240);}
    #ocean {background: rgb(240, 255, 251);}
    #desert {background: rgb(255, 252, 241);}
</style>
</head>
<body data-spy="scroll" data-target="safariNav" data offset="60">
    <div id="safariCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#safariCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#safariCarousel" data-slide-to="1"></li>
            <li data-target="#safariCarousel" data-slide-to="2"></li>
        </ol>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active safari-slide slide-forest">🌳 Forest Safari</div>
        <div class="carousel-item active safari-slide slide-ocean">🌊 Ocean Safari</div>
        <div class="carousel-item active safari-slide slide-desert">🏜️ Desert Safari</div>
    </div>
    </div>
    </div>
    <a class="carousel-control-prev" href="#safariCarousel" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </a>
    <a class="carousel-control-next" href="#safariCarousel" data-slide="next">
        <span class="carousel-control-next-icon"></span>
    </a>
</body>
</html>
